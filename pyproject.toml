[project]
name = "spotify-global-semantic-search"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=27.0.1",
    "hnswlib>=0.8.0 ; sys_platform == 'linux'",
    "ipykernel>=7.4.0",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
