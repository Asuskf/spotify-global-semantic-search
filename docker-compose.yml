# Antes: generar data/gold DENTRO de Docker (hnswlib solo compila en Linux):
#   docker build -f docker/api.Dockerfile --target dev -t spotify-dev .
#   MSYS_NO_PATHCONV=1 docker run --rm -v "$(pwd -W):/work" -v spotify-global-semantic-search_hf_cache:/root/.cache/huggingface spotify-dev python -m src.pipeline gold
name: spotify-global-semantic-search  # fija el nombre del volumen hf_cache, que usa init.sh
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      GOLD_DIR: /app/data/gold
    volumes:
      - ./data/gold:/app/data/gold:ro
      - hf_cache:/root/.cache/huggingface
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s  # carga del modelo e5 en CPU

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache:
